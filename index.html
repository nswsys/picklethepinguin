<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Pickle the Penguin 🐧</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA: instalable y pantalla completa en móvil -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1e2d" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <!-- iOS: "Añadir a inicio" + barra de estado integrada -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pickle" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="800" height="300"></canvas>
    <div id="hud">
      <span id="score">0</span>
      <span id="best">HI 0</span>
    </div>
    <div id="overlay" class="show">
      <img id="overlay-peng" src="assets/penguin_run1.png" alt="Pickle the Penguin" />
      <h1 id="overlay-title">Pickle the Penguin</h1>
      <p id="overlay-msg">Tap or press <b>Space</b> / <b>↑</b> to start</p>
      <p class="hint">Jump to dodge. Press ↓ to duck. Eat 5 fish for a random power-up!</p>
    </div>
  </div>
  <p class="footer">Space / ↑ = jump &nbsp;·&nbsp; ↓ = duck &nbsp;·&nbsp; P = pause &nbsp;·&nbsp; on mobile: tap the screen</p>
  <div id="rotate-hint">
    <div class="rot-emoji">📱</div>
    <p>Rotate your device to landscape to play 🐧</p>
  </div>
  <script src="game.js"></script>
  <script>
    // Registra el service worker (necesario para instalar la PWA y jugar offline)
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
